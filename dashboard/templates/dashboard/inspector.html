{% extends 'dashboard/base.html' %}
{% load static %}

{% block title %}Inspector - Floci Dashboard{% endblock %}

{% block content %}
  <header class="page-header">
    <div>
      <p class="page-kicker">Local workflow payloads</p>
      <h1 class="console-title">Inspector</h1>
    </div>
    <div class="page-header-actions">
      <button id="inspector-refresh" class="secondary-button" type="button">Refresh</button>
    </div>
  </header>

  <section class="section-block inspector-shell">
    <div class="inspector-tabs" role="tablist" aria-label="Inspection sections">
      <button class="inspector-tab inspector-tab-active" type="button" data-inspector-tab="messages">Messages</button>
      <button class="inspector-tab" type="button" data-inspector-tab="email">Email</button>
      <button class="inspector-tab" type="button" data-inspector-tab="notifications">Notifications</button>
      <button class="inspector-tab" type="button" data-inspector-tab="logs">Logs</button>
    </div>

    <div id="inspector-alerts" class="environment-alerts" aria-live="polite"></div>

    <div class="inspector-layout">
      <section id="inspector-list" class="inspector-panel" aria-live="polite"></section>
      <aside id="inspector-detail" class="inspector-panel inspector-detail" aria-live="polite"></aside>
    </div>
  </section>
{% endblock %}

{% block extrascripts %}
  <script src="{% static 'dashboard/service-console.js' %}?v={{ dashboard_js_version }}"></script>
  <script src="{% static 'dashboard/inspector.js' %}?v={{ dashboard_js_version }}"></script>
{% endblock %}
